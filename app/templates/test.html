<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>API Test</title>
    <style>
        body { font-family: Arial; padding: 20px; background: #111; color: #0f0; }
        button { padding: 10px 20px; margin: 10px; cursor: pointer; }
        .result { background: #222; padding: 15px; margin: 10px 0; border-radius: 5px; white-space: pre-wrap; }
        .error { color: #f00; }
        .success { color: #0f0; }
    </style>
</head>
<body>
    <h1>🔧 API Debug Test</h1>
    <p>Current URL: <span id="url"></span></p>

    <button onclick="testHealth()">Test /api/health</button>
    <button onclick="testChat()">Test /api/chat</button>
    <button onclick="testNews()">Test /api/news</button>
    <button onclick="testQuiz()">Test /api/quiz</button>

    <div id="results"></div>

    <script>
        document.getElementById('url').textContent = window.location.origin;

        async function testEndpoint(name, url, method, body) {
            const results = document.getElementById('results');
            results.innerHTML += '<div class="result"><strong>Testing ' + name + '...</strong></div>';

            try {
                const options = { method: method, headers: {} };
                if (body) {
                    options.headers['Content-Type'] = 'application/json';
                    options.body = JSON.stringify(body);
                }

                const res = await fetch(url, options);
                const text = await res.text();

                let parsed;
                try { parsed = JSON.parse(text); } catch(e) { parsed = text; }

                results.innerHTML += '<div class="result ' + (res.ok ? 'success' : 'error') + '">' +
                    '<strong>' + name + ':</strong> ' + res.status + ' ' + res.statusText + '\n' +
                    JSON.stringify(parsed, null, 2).substring(0, 1000) +
                '</div>';
            } catch(e) {
                results.innerHTML += '<div class="result error"><strong>' + name + ' ERROR:</strong> ' + e.message + '</div>';
            }
        }

        function testHealth() {
            testEndpoint('Health', window.location.origin + '/api/health', 'GET');
        }

        function testChat() {
            testEndpoint('Chat', window.location.origin + '/api/chat', 'POST', {
                message: 'what is firewall',
                history: []
            });
        }

        function testNews() {
            testEndpoint('News', window.location.origin + '/api/news', 'GET');
        }

        function testQuiz() {
            testEndpoint('Quiz', window.location.origin + '/api/quiz', 'GET');
        }

        // Auto-test health on load
        testHealth();
    </script>
</body>
</html>
