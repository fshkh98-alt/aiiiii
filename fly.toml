app = 'cybersentinel-ai'
primary_region = 'iad'

[build]
  dockerfile = 'Dockerfile'

[env]
  ENV = 'production'
  ALLOWED_ORIGINS = 'https://cybersentinel-ai.fly.dev'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
